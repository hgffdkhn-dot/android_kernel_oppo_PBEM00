name: Build R17 Kernel

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '编译模式（先跑 stock 验证开机）'
        required: true
        default: 'stock'
        type: choice
        options:
          - stock
          - ksunext

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: 检出内核源码
        uses: actions/checkout@v4
        with:
          ref: ten
          fetch-depth: 1

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison flex libssl-dev libelf-dev ccache \
            make gcc device-tree-compiler zip curl \
            python3 python-is-python3

      - name: 下载 GCC 4.9 工具链
        run: |
          set -e
          rm -rf "$GITHUB_WORKSPACE/tc"
          mkdir -p "$GITHUB_WORKSPACE/tc"
          if git clone --depth 1 -b lineage-19.1 \
              https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
              "$GITHUB_WORKSPACE/tc" ; then
            echo "[OK] LineageOS 镜像"
          else
            rm -rf "$GITHUB_WORKSPACE/tc"
            git clone --depth 1 \
              https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
              "$GITHUB_WORKSPACE/tc"
          fi

      - name: 校验工具链
        run: |
          set -e
          export CROSS_COMPILE=$GITHUB_WORKSPACE/tc/bin/aarch64-linux-android-
          [ -f "${CROSS_COMPILE}gcc" ] || { echo "::error::工具链缺失"; exit 1; }
          chmod +x "$GITHUB_WORKSPACE/tc/bin/"*
          "${CROSS_COMPILE}gcc" --version || { echo "::error::gcc 无法执行"; exit 1; }

      # ============================================================
      # ten 分支（realme X fork）里从未被编译过的代码路径，
      # 被 R17 出厂配置触发后才暴露。以下按实际报错逐个修。
      # ============================================================

      - name: "[修复1] 蓝牙 btfm_slim — 缺 include 路径"
        run: |
          set -e
          # btfm_slim.c 用 #include <btfm_slim.h>，但 Makefile 无 -I 指向自身目录
          for h in btfm_slim.h btfm_slim_wcn3990.h; do
            if [ -f "drivers/bluetooth/$h" ]; then
              echo "[=] $h 已存在"
            else
              cp "ksu-build/$h" "drivers/bluetooth/$h" && echo "[+] 补齐 $h"
            fi
          done
          MK=drivers/bluetooth/Makefile
          if [ -f "$MK" ] && ! grep -q -- '-I\$(src)' "$MK"; then
            sed -i '/^ccflags-y/a ccflags-y += -I$(src)' "$MK"
            echo "[+] 已给 $MK 加 -I\$(src)"
          fi
          grep -n "ccflags" "$MK" || true

      - name: "[修复2] NXP 功放 tfa98xx — R17 无此硬件"
        run: |
          set -e
          # 报错: 'np' undeclared / tfa98xx_parse_dt / -Wno-enum-conversion
          # R17 出厂配置确认无 NXP 功放（TFA9879 都是 n）
          echo "=== 处理前 Makefile 引用 ==="
          grep -rni "tfa98" techpack/ --include=Makefile --include=Kbuild || echo "(无)"
          find techpack \( -name 'Makefile' -o -name 'Kbuild' \) \
            -exec sed -i '/tfa98/Id' {} + 2>/dev/null || true
          # 兜底：即便父 Makefile 仍递归进来，子目录 Makefile 为空则不编译
          for m in $(find techpack -path '*tfa98xx*' -name 'Makefile'); do
            : > "$m"; echo "[+] 已清空 $m"
          done
          echo "=== 处理后 Makefile 引用 ==="
          grep -rni "tfa98" techpack/ --include=Makefile --include=Kbuild || echo "(已清空)"

      - name: "[修复3] mdss_pll_trace.h — trace 头文件路径"
        run: |
          set -e
          # 报错: ./include/trace/define_trace.h:88 fatal error: ./mdss_pll_trace.h
          # 成因: mdss_pll_trace.h 里 #define TRACE_INCLUDE_PATH .
          #      define_trace.h 在 include/trace/ 下，按相对自身目录找不到该文件
          H=drivers/clk/qcom/mdss/mdss_pll_trace.h
          if [ -f "$H" ]; then
            cp "$H" "$H.bak"
            sed -i 's|#define TRACE_INCLUDE_PATH \.$|#define TRACE_INCLUDE_PATH ../../drivers/clk/qcom/mdss|' "$H"
            echo "[+] 已改 TRACE_INCLUDE_PATH:"
            grep -n "TRACE_INCLUDE_PATH" "$H" | tail -2
          else
            echo "[!] $H 不存在，跳过"
          fi
          MK=drivers/clk/qcom/mdss/Makefile
          if [ -f "$MK" ] && ! grep -q -- '-I\$(src)' "$MK"; then
            sed -i '/^ccflags-y/a ccflags-y += -I$(src)' "$MK" 2>/dev/null \
              || echo "ccflags-y += -I$(src)" >> "$MK"
            echo "[+] 已给 $MK 加 -I\$(src)"
          fi
          grep -n "ccflags" "$MK" || true

      - name: "[修复4] 移除 GCC 4.9 不认识的编译选项"
        run: |
          set -e
          # -Wno-enum-conversion 是 GCC 8+ 选项，4.9 不识别且被 -Werror 放大
          n=$(grep -rl "Wno-enum-conversion" techpack kernel drivers 2>/dev/null | wc -l)
          echo "命中文件数: $n"
          [ "$n" -gt 0 ] && grep -rl "Wno-enum-conversion" techpack kernel drivers 2>/dev/null \
            | xargs -r sed -i 's/-Wno-enum-conversion//g' || true
          echo "[OK] 已清除"

      - name: 应用 defconfig
        run: |
          set -e
          cp arch/arm64/configs/sdm670_r17_ksu_defconfig .config
          grep -E "CONFIG_KSU=|CONFIG_BTFM_SLIM=|TFA98XX" .config || true

      - name: 解析依赖
        run: |
          set -e
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=$GITHUB_WORKSPACE/tc/bin/aarch64-linux-android-
          make olddefconfig

      # ================= 仅 ksunext 模式 =================
      - name: "[KSU] 拉取 Reno 4.9 backport"
        if: inputs.mode == 'ksunext'
        run: |
          git config user.email ci@example.com
          git config user.name CI
          git remote add reno https://github.com/OP46B1-Dev/android_kernel_oppo_sdm710.git
          git fetch --depth 1 reno deprecated/color-11.1_rksu
          for sha in \
            ba18867fe84e9e41d13535eee933a9f5e733babf \
            7e103d9bc84bbb791b65b15ad7c9b62d3023eb0e \
            782269366a1928466ba8aa4f0bffc88da861d866 \
            be3865c776a668bc914976b6c5f42fc8b1fe8bd1 \
            3460c15b1b937b7a8b256c1f2982debc10bf1301 \
            38baa0988a7aeef2efbfb4ccf6b06dd8d50e0538 \
            ba688d384ae45185e509d4152c5c86b82b1011bb ; do
            echo "--- cherry-pick $sha"
            git cherry-pick --no-commit "$sha" || echo "[!] 冲突 $sha"
          done
          git status --short

      - name: "[KSU] 安装 KernelSU-Next"
        if: inputs.mode == 'ksunext'
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" | bash -s legacy
          ls drivers/kernelsu || echo "[!] 缺失"

      - name: "[KSU] 注入 hook"
        if: inputs.mode == 'ksunext'
        run: python3 ksu-build/inject_hooks.py .

      # ================= 编译 =================
      - name: 编译内核
        run: |
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=$GITHUB_WORKSPACE/tc/bin/aarch64-linux-android-
          export USE_CCACHE=1 CCACHE_DIR=$GITHUB_WORKSPACE/.ccache
          # -k : 遇错继续，一次跑完收集全部错误，避免来回试
          ret=0
          make -k -j$(nproc) > build.log 2>&1 || ret=$?
          echo "===== 最后 60 行 ====="
          tail -60 build.log
          echo "===== 全部错误/警告汇总 ====="
          grep -nE "fatal error:|error:|Error [0-9]+|undeclared|implicit declaration" build.log \
            | sort -u | head -50
          echo "===== make exit=$ret ====="
          exit $ret

      - name: 收集产物
        run: |
          set -e
          mkdir -p out
          ok=0
          for f in arch/arm64/boot/Image.gz-dtb \
                   arch/arm64/boot/Image.gz \
                   arch/arm64/boot/Image-dtb \
                   arch/arm64/boot/Image ; do
            if [ -f "$f" ]; then cp "$f" out/; echo "[+] $f"; ok=1; fi
          done
          cp .config out/config.txt
          [ -f build.log ] && cp build.log out/build.log || true
          ls -la out/
          [ "$ok" -eq 1 ] || { echo "::error::未生成内核镜像"; exit 1; }

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: r17-${{ inputs.mode }}
          path: out/
          retention-days: 30
